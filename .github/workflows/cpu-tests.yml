name: CPU tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU dependencies
        run: python -m pip install -e .
      - name: Verify versioned source integrity
        run: python scripts/check_integrity.py
      - name: Fetch public assets
        run: pace setup-assets
      - name: Solver and release-tool tests
        run: |
          python -m unittest discover -s tests/unit -t . -v
      - name: Construction and guard tests
        run: |
          python -m tests.regression.ifeval
          python -m tests.regression.ifbench
      - name: CLI and audit-metric smoke checks
        run: |
          pace --help
          pace run --help
          python -m pace evaluate --help
          python run.py --help
          python evaluate.py --help
          pace audit examples/audit_fixture.json --output reports/synthetic-audit.json

