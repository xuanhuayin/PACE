name: CPU tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify versioned source integrity
        run: python scripts/check_integrity.py
      - name: Fetch public assets
        run: python setup_assets.py
      - name: Solver and release-tool tests
        run: |
          python -m unittest test_branched_token_map_v1 test_branched_token_map_sparse_v1 test_tess_branched_quotient_v1
          python -m unittest discover -s tests -v
      - name: Construction and guard tests
        run: |
          python cah/test_program_gen4.py
          python cah/test_program_ifb4.py
      - name: CLI and audit-metric smoke checks
        run: |
          python run.py --help
          python evaluate.py --help
          python scripts/audit_metrics.py examples/audit_fixture.json --output reports/synthetic-audit.json

